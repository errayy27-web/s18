workflows:
  android-debug:
    name: SS OIL Android test APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Create complete Flutter Android scaffold
        script: |
          set -eu
          mkdir -p /tmp/ssoil_generated
          cd /tmp/ssoil_generated
          flutter create --platforms=android --org com.ssoil --project-name ss_oil_stok_kontrol .
          cd "$CM_BUILD_DIR"
          cp -R /tmp/ssoil_generated/android ./android_scaffold
          cp -R android_scaffold/. ./android/
          rm -rf android_scaffold
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          s=manifest.read_text()
          s=s.replace('<application','<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.CAMERA"/><application',1)
          s=s.replace('<application','<application android:usesCleartextTraffic="true"',1)
          manifest.write_text(s)
          for icon in Path('android_icons').glob('mipmap-*/ic_launcher.png'):
              dst=Path('android/app/src/main/res')/icon.parent.name/'ic_launcher.png'
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(icon,dst)
          PYCODE
          flutter pub get
      - name: Build Android debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
